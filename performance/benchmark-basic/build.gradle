plugins {
    id "java-module"
    id "code-quality"
    id "benchmark-jars"
}

description = "JMH micro-benchmarks for the hibernate-accessor strategies (fixed, hand-authored models)"

dependencies {
    // The benchmark sources compile against the core module only. The reflection,
    // method-handle and lambda strategies live here. The asm and bytebuddy factories
    // are resolved reflectively at runtime (see Strategy), so those modules are a pure
    // runtime-bundling concern handled per benchmark jar by the `benchmark-jars` convention.
    implementation project( ":hibernate-accessor" )

    implementation libs.jmh.core
    annotationProcessor libs.jmh.generatorAnnprocess
}
